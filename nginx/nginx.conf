worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  server_tokens off;
  keepalive_timeout 65s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  # Also the studio lighting (.hdr, served as application/octet-stream) and models (.glb).
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream model/gltf-binary;

  # Docker's embedded DNS; lets nginx pick up API replicas as they scale up or down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;

  upstream api {
    zone api_upstream 1m;
    least_conn;
    server api:4000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
      limit_req zone=api_rate burst=40 nodelay;
      limit_req_status 429;
      client_max_body_size 32k;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }

    # Product photos uploaded in the admin panel: larger bodies than the rest of the API.
    location = /api/admin/images {
      limit_req zone=api_rate burst=10 nodelay;
      limit_req_status 429;
      client_max_body_size 3m;

      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Story assets and product photos keep their names so they can be swapped in place: cache for a day.
    location ~ ^/(models|textures|products)/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
